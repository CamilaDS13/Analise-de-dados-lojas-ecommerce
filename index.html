<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard E-commerce</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Análise de Dados E-commerce</h1>
                <p class="text-slate-500">Monitoramento de vendas e rupturas por unidade</p>
            </div>
            
            <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100">
                <span class="text-slate-400 font-medium">Filtrar Mês:</span>
                <select id="monthSelector" class="outline-none bg-transparent cursor-pointer text-indigo-600 font-bold text-lg">
                    <option value="consolidado">Todos os Meses</option>
                </select>
            </div>
        </div>

        <!-- Grid de Cards Principais -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            
            <!-- Card Maior Faturamento -->
            <div class="glass-card p-6 rounded-3xl shadow-sm border-t-4 border-indigo-500">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Pico de Vendas</p>
                    <span class="p-2 bg-indigo-50 rounded-lg text-indigo-500">📈</span>
                </div>
                <h2 id="topMonth" class="text-2xl font-bold text-slate-800 mt-3">-</h2>
                <p id="topMonthValue" class="text-indigo-600 text-sm font-semibold mt-1"></p>
            </div>

            <!-- Card Rupturas VIP -->
            <div class="glass-card p-6 rounded-3xl shadow-sm border-t-4 border-orange-400">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Rupturas VIP</p>
                    <span class="p-2 bg-orange-50 rounded-lg text-orange-500">⚠️</span>
                </div>
                <h2 id="rupturaVip" class="text-3xl font-bold text-slate-800 mt-3">0</h2>
                <p class="text-slate-400 text-xs mt-1">Total de ocorrências</p>
            </div>

            <!-- Card Rupturas iFood -->
            <div class="glass-card p-6 rounded-3xl shadow-sm border-t-4 border-red-500">
                <div class="flex justify-between items-start">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Rupturas iFood</p>
                    <span class="p-2 bg-red-50 rounded-lg text-red-500">🛵</span>
                </div>
                <h2 id="rupturaIfood" class="text-3xl font-bold text-slate-800 mt-3">0</h2>
                <p class="text-slate-400 text-xs mt-1">Itens totais</p>
            </div>

            <!-- Participação -->
            <div class="glass-card p-6 rounded-3xl shadow-sm border-t-4 border-emerald-500 h-48 overflow-y-auto">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Market Share Loja</p>
                <div id="participationList" class="text-sm space-y-2">
                    <!-- Dinâmico -->
                </div>
            </div>
        </div>

        <!-- Destaques das Lojas -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-card bg-gradient-to-br from-indigo-50 to-white p-8 rounded-3xl shadow-sm border border-indigo-100">
                <div class="flex items-center gap-2 mb-6">
                    <span class="w-2 h-8 bg-indigo-500 rounded-full"></span>
                    <h3 class="font-bold text-indigo-900 text-lg uppercase tracking-wide">Top Unidade VIP</h3>
                </div>
                <p id="bestStoreVip" class="text-4xl font-black text-slate-800">-</p>
                <div class="flex items-center mt-4">
                    <p id="bestStoreVipVal" class="text-indigo-600 text-xl font-bold"></p>
                </div>
            </div>

            <div class="glass-card bg-gradient-to-br from-red-50 to-white p-8 rounded-3xl shadow-sm border border-red-100">
                <div class="flex items-center gap-2 mb-6">
                    <span class="w-2 h-8 bg-red-500 rounded-full"></span>
                    <h3 class="font-bold text-red-900 text-lg uppercase tracking-wide">Top Unidade iFood</h3>
                </div>
                <p id="bestStoreIfood" class="text-4xl font-black text-slate-800">-</p>
                <div class="flex items-center mt-4">
                    <p id="bestStoreIfoodVal" class="text-red-600 text-xl font-bold"></p>
                </div>
            </div>
        </div>

        <div id="loader" class="fixed inset-0 flex items-center justify-center bg-white bg-opacity-80 z-50">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-600"></div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYAbzRN6yVIhTqgC17o5QlfH6uU5R8-0Jssq03US8b0R56ab_9ZGPsJr3sJvrlRSWm5AA7YdMINYMt/pub?output=csv';

        let rawData = [];

        // Função para converter "R$ 1.234,56" em número 1234.56
        function parseCurrency(val) {
            if (!val || typeof val !== 'string') return typeof val === 'number' ? val : 0;
            const clean = val.replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
            return parseFloat(clean) || 0;
        }

        async function init() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    rawData = results.data.filter(row => row.LOJA); // Garante que a linha tenha uma loja
                    setupSelector();
                    updateUI('consolidado');
                    document.getElementById('loader').classList.add('hidden');
                }
            });
        }

        function setupSelector() {
            const meses = [...new Set(rawData.map(r => r.DATA))].filter(m => m);
            const selector = document.getElementById('monthSelector');
            meses.forEach(mes => {
                const opt = document.createElement('option');
                opt.value = mes;
                opt.textContent = mes;
                selector.appendChild(opt);
            });
        }

        function updateUI(mesSelecionado) {
            const filtered = mesSelecionado === 'consolidado' 
                ? rawData 
                : rawData.filter(r => r.DATA === mesSelecionado);

            // Cálculos
            const storeStats = {};
            let totalGeral = 0;
            let totalRupturaVip = 0;
            let totalRupturaIfood = 0;

            filtered.forEach(row => {
                const loja = row.LOJA;
                const vVip = parseCurrency(row['VENDA VIP']);
                const vIfood = parseCurrency(row['VENDA IFOOD']);
                // Se a planilha não tiver coluna específica de Ruptura VIP, estou somando 0 ou usando 'RUPTURA VIP' se existir
                const rVip = parseCurrency(row['RUPTURA VIP'] || 0); 
                const rIfood = parseCurrency(row['QTD ITENS RUPTURADOS IFOOD'] || 0);

                if (!storeStats[loja]) {
                    storeStats[loja] = { total: 0, vip: 0, ifood: 0 };
                }

                storeStats[loja].total += (vVip + vIfood);
                storeStats[loja].vip += vVip;
                storeStats[loja].ifood += vIfood;
                
                totalGeral += (vVip + vIfood);
                totalRupturaVip += rVip;
                totalRupturaIfood += rIfood;
            });

            // Card Mês de Maior Venda (Sempre baseado no histórico total)
            const salesByMonth = {};
            rawData.forEach(row => {
                const m = row.DATA;
                const v = parseCurrency(row['VENDA VIP']) + parseCurrency(row['VENDA IFOOD']);
                salesByMonth[m] = (salesByMonth[m] || 0) + v;
            });
            const topM = Object.keys(salesByMonth).reduce((a, b) => salesByMonth[a] > salesByMonth[b] ? a : b);
            document.getElementById('topMonth').textContent = topM;
            document.getElementById('topMonthValue').textContent = `R$ ${salesByMonth[topM].toLocaleString('pt-BR')}`;

            // Atualizar Rupturas
            document.getElementById('rupturaVip').textContent = totalRupturaVip.toLocaleString('pt-BR');
            document.getElementById('rupturaIfood').textContent = totalRupturaIfood.toLocaleString('pt-BR');

            // Market Share
            const partList = document.getElementById('participationList');
            partList.innerHTML = '';
            const sortedLojas = Object.keys(storeStats).sort((a,b) => storeStats[b].total - storeStats[a].total);
            
            sortedLojas.forEach(loja => {
                const percent = totalGeral > 0 ? ((storeStats[loja].total / totalGeral) * 100).toFixed(1) : 0;
                partList.innerHTML += `
                    <div class="flex justify-between items-center border-b border-slate-50 pb-1">
                        <span class="text-slate-600 font-medium truncate w-32">${loja}</span>
                        <span class="font-bold text-emerald-600">${percent}%</span>
                    </div>
                `;
            });

            // Top Lojas por Canal
            const bestVip = sortedLojas.reduce((a, b) => storeStats[a].vip > storeStats[b].vip ? a : b, sortedLojas[0]);
            const bestIfood = sortedLojas.reduce((a, b) => storeStats[a].ifood > storeStats[b].ifood ? a : b, sortedLojas[0]);

            document.getElementById('bestStoreVip').textContent = bestVip || '-';
            document.getElementById('bestStoreVipVal').textContent = `R$ ${storeStats[bestVip]?.vip.toLocaleString('pt-BR') || 0}`;
            
            document.getElementById('bestStoreIfood').textContent = bestIfood || '-';
            document.getElementById('bestStoreIfoodVal').textContent = `R$ ${storeStats[bestIfood]?.ifood.toLocaleString('pt-BR') || 0}`;
        }

        document.getElementById('monthSelector').addEventListener('change', (e) => updateUI(e.target.value));
        
        init();
    </script>
</body>
</html>
