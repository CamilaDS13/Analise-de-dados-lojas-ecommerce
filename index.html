<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Vendas - Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Dashboard de Performance</h1>
                <p class="text-gray-500">Análise de vendas e rupturas</p>
            </div>
            
            <div class="flex items-center gap-3 bg-white p-2 rounded-lg shadow-sm border">
                <label class="font-semibold text-gray-700">Período:</label>
                <select id="monthSelector" class="outline-none bg-transparent cursor-pointer text-blue-600 font-bold">
                    <option value="consolidado">Consolidado (Tudo)</option>
                </select>
            </div>
        </div>

        <!-- Grid de Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            
            <!-- Card Maior Venda -->
            <div class="card bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                <p class="text-sm text-gray-500 uppercase font-bold">Mês de Maior Venda</p>
                <h2 id="topMonth" class="text-2xl font-bold text-gray-800 mt-2">-</h2>
                <p id="topMonthValue" class="text-blue-500 text-sm font-medium mt-1"></p>
            </div>

            <!-- Card Rupturas VIP -->
            <div class="card bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-400">
                <p class="text-sm text-gray-500 uppercase font-bold">Rupturas VIP</p>
                <h2 id="rupturaVip" class="text-3xl font-bold text-gray-800 mt-2">0</h2>
                <span class="text-xs text-gray-400 italic">Total no período</span>
            </div>

            <!-- Card Rupturas iFood -->
            <div class="card bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-600">
                <p class="text-sm text-gray-500 uppercase font-bold">Rupturas iFood</p>
                <h2 id="rupturaIfood" class="text-3xl font-bold text-gray-800 mt-2">0</h2>
                <span class="text-xs text-gray-400 italic">Total no período</span>
            </div>

            <!-- Participação -->
            <div class="card bg-white p-6 rounded-2xl shadow-sm border-l-4 border-green-500 overflow-hidden">
                <p class="text-sm text-gray-500 uppercase font-bold">Market Share (Lojas)</p>
                <div id="participationList" class="mt-3 text-sm space-y-1">
                    <!-- Dinâmico -->
                </div>
            </div>
        </div>

        <!-- Cards de Destaque por Canal -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card bg-gradient-to-br from-blue-50 to-white p-6 rounded-2xl shadow-sm border border-blue-100">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-blue-800 uppercase tracking-wider">Top Loja - Canal VIP</h3>
                    <span class="bg-blue-200 text-blue-800 text-xs px-2 py-1 rounded">Vendas</span>
                </div>
                <p id="bestStoreVip" class="text-3xl font-extrabold text-gray-800 mt-4">-</p>
                <p id="bestStoreVipVal" class="text-blue-600 font-semibold"></p>
            </div>

            <div class="card bg-gradient-to-br from-red-50 to-white p-6 rounded-2xl shadow-sm border border-red-100">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-red-800 uppercase tracking-wider">Top Loja - iFood</h3>
                    <span class="bg-red-200 text-red-800 text-xs px-2 py-1 rounded">Vendas</span>
                </div>
                <p id="bestStoreIfood" class="text-3xl font-extrabold text-gray-800 mt-4">-</p>
                <p id="bestStoreIfoodVal" class="text-red-600 font-semibold"></p>
            </div>
        </div>

        <div id="loader" class="text-center mt-20 text-gray-500">
            Carregando dados da planilha...
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYAbzRN6yVIhTqgC17o5QlfH6uU5R8-0Jssq03US8b0R56ab_9ZGPsJr3sJvrlRSWm5AA7YdMINYMt/pub?output=csv';

        let globalData = [];
        let months = [];

        async function fetchData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    globalData = results.data.filter(row => row.Loja || row.loja); // Remove linhas vazias
                    processData();
                    document.getElementById('loader').classList.add('hidden');
                }
            });
        }

        function getVal(obj, keywords) {
            const key = Object.keys(obj).find(k => keywords.some(kw => k.toLowerCase().includes(kw.toLowerCase())));
            return key ? obj[key] : 0;
        }

        function processData() {
            // Extrair meses únicos
            const monthSet = new Set();
            globalData.forEach(row => {
                const dateVal = getVal(row, ['data', 'mes', 'período']);
                if(dateVal) monthSet.add(dateVal);
            });
            
            months = Array.from(monthSet);
            const selector = document.getElementById('monthSelector');
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                selector.appendChild(opt);
            });

            updateDashboard('consolidado');
        }

        function updateDashboard(selectedMonth) {
            const data = selectedMonth === 'consolidado' 
                ? globalData 
                : globalData.filter(row => getVal(row, ['data', 'mes', 'período']) === selectedMonth);

            // 1. Maior Venda (Mês)
            const salesByMonth = {};
            globalData.forEach(row => {
                const m = getVal(row, ['data', 'mes', 'período']);
                const v = Number(getVal(row, ['venda total', 'venda_total'])) || (Number(getVal(row, ['vip'])) + Number(getVal(row, ['ifood'])));
                salesByMonth[m] = (salesByMonth[m] || 0) + v;
            });
            const topM = Object.keys(salesByMonth).reduce((a, b) => salesByMonth[a] > salesByMonth[b] ? a : b);
            document.getElementById('topMonth').textContent = topM;
            document.getElementById('topMonthValue').textContent = `Total: R$ ${salesByMonth[topM].toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

            // 2. Rupturas
            let rupVip = 0;
            let rupIfood = 0;
            data.forEach(row => {
                rupVip += Number(getVal(row, ['ruptura vip', 'ruptura_vip'])) || 0;
                rupIfood += Number(getVal(row, ['ruptura ifood', 'ruptura_ifood'])) || 0;
            });
            document.getElementById('rupturaVip').textContent = rupVip;
            document.getElementById('rupturaIfood').textContent = rupIfood;

            // 3. Participação e Melhores Lojas
            const storeSales = {};
            const storeVip = {};
            const storeIfood = {};
            let totalPeriodo = 0;

            data.forEach(row => {
                const loja = getVal(row, ['loja', 'unidade']);
                const vVip = Number(getVal(row, ['venda vip', 'venda_vip'])) || 0;
                const vIfood = Number(getVal(row, ['venda ifood', 'venda_ifood', 'ifood'])) || 0;
                const total = vVip + vIfood;

                storeSales[loja] = (storeSales[loja] || 0) + total;
                storeVip[loja] = (storeVip[loja] || 0) + vVip;
                storeIfood[loja] = (storeIfood[loja] || 0) + vIfood;
                totalPeriodo += total;
            });

            // Renderizar Participação
            const partList = document.getElementById('participationList');
            partList.innerHTML = '';
            Object.keys(storeSales).sort((a,b) => storeSales[b] - storeSales[a]).forEach(loja => {
                const percent = ((storeSales[loja] / totalPeriodo) * 100).toFixed(1);
                partList.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-50 pb-1">
                        <span class="truncate mr-2">${loja}</span>
                        <span class="font-bold text-green-600">${percent}%</span>
                    </div>
                `;
            });

            // Melhores Lojas por canal
            const bestVipLoja = Object.keys(storeVip).reduce((a, b) => storeVip[a] > storeVip[b] ? a : b);
            const bestIfoodLoja = Object.keys(storeIfood).reduce((a, b) => storeIfood[a] > storeIfood[b] ? a : b);

            document.getElementById('bestStoreVip').textContent = bestVipLoja;
            document.getElementById('bestStoreVipVal').textContent = `R$ ${storeVip[bestVipLoja].toLocaleString('pt-BR')}`;
            
            document.getElementById('bestStoreIfood').textContent = bestIfoodLoja;
            document.getElementById('bestStoreIfoodVal').textContent = `R$ ${storeIfood[bestIfoodLoja].toLocaleString('pt-BR')}`;
        }

        document.getElementById('monthSelector').addEventListener('change', (e) => {
            updateDashboard(e.target.value);
        });

        fetchData();
    </script>
</body>
</html>
