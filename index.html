<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ecommerce Pro</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f97316; /* Laranja vibrante */
            min-height: 100vh;
        }
        .card-blue {
            background: #1e3a8a; /* Azul escuro */
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Efeito de movimento ao passar o mouse */
        .card-blue:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            background: #1e40af;
        }
        .custom-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        select { border: none !important; outline: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header com Filtros e Exportação -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4 bg-white/10 p-6 rounded-[2.5rem] backdrop-blur-md border border-white/20">
            <div>
                <h1 class="text-3xl font-extrabold text-white">Ecommerce Dashboard</h1>
                <p class="text-orange-100 font-medium italic">Dados em Tempo Real</p>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <!-- Filtro de Mês -->
                <div class="bg-white rounded-2xl px-4 py-2 flex items-center shadow-lg">
                    <span class="text-[10px] font-bold text-slate-400 uppercase mr-2 text-orange-600">Filtrar Mês:</span>
                    <select id="filtro-mes" class="font-bold text-slate-700 bg-transparent cursor-pointer">
                        <option value="TODOS">Todos os Meses</option>
                    </select>
                </div>

                <!-- Botão Exportar -->
                <button onclick="exportarExcel()" class="bg-blue-900 hover:bg-black text-white px-6 py-2 rounded-2xl font-bold flex items-center transition-all shadow-lg">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Exportar Excel
                </button>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="card-blue p-6 rounded-[2rem] custom-shadow border-b-4 border-white/20">
                <p class="text-xs font-bold text-orange-300 uppercase mb-1">Mês de Maior Venda</p>
                <h2 id="kpi-mes" class="text-2xl font-black italic uppercase">---</h2>
                <p id="kpi-mes-valor" class="text-white/70 font-bold text-sm"></p>
            </div>

            <div class="card-blue p-6 rounded-[2rem] custom-shadow border-b-4 border-white/20">
                <p class="text-xs font-bold text-orange-300 uppercase mb-3">Líderes por Canal</p>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs font-bold bg-white/10 p-2 rounded-lg">
                        <span class="text-sky-300 italic uppercase">VIP</span>
                        <span id="top-vip">---</span>
                    </div>
                    <div class="flex justify-between text-xs font-bold bg-white/10 p-2 rounded-lg">
                        <span class="text-rose-400 italic uppercase">IFOOD</span>
                        <span id="top-ifood">---</span>
                    </div>
                </div>
            </div>

            <div class="card-blue p-6 rounded-[2rem] custom-shadow border-b-4 border-white/20">
                <p class="text-xs font-bold text-orange-300 uppercase mb-2">Total de Rupturas</p>
                <div class="flex items-end justify-between">
                    <span id="rupturas-total" class="text-4xl font-black">0</span>
                    <div class="text-right">
                        <span class="text-[9px] font-black bg-white/20 px-2 py-1 rounded">ESTOQUE</span>
                    </div>
                </div>
            </div>

            <div class="card-blue p-6 rounded-[2rem] custom-shadow border-b-4 border-white/20">
                <p class="text-xs font-bold text-orange-300 uppercase mb-1">Atingimento de Meta</p>
                <h2 id="kpi-meta-percent" class="text-3xl font-black">0%</h2>
                <div class="w-full bg-white/10 h-2 rounded-full mt-3">
                    <div id="meta-bar" class="bg-orange-500 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="flex flex-col gap-8">
            <!-- Gráfico de Volume -->
            <div class="bg-white p-8 rounded-[3rem] custom-shadow" style="height: 350px;">
                <h3 class="text-sm font-black text-slate-800 mb-6 flex items-center">
                    <span class="w-3 h-3 bg-blue-600 rounded-full mr-2"></span>
                    VOLUME DE VENDAS POR UNIDADE (R$)
                </h3>
                <div class="h-[230px]">
                    <canvas id="chartBarras"></canvas>
                </div>
            </div>

            <!-- Tabela de Ranking -->
            <div class="bg-white rounded-[3rem] custom-shadow overflow-hidden mb-10">
                <div class="p-8 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest italic">Performance por Loja</h3>
                </div>
                <div class="overflow-x-auto p-4">
                    <table id="tabela-dados" class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] uppercase text-slate-400 font-black border-b">
                                <th class="px-6 py-4">Loja</th>
                                <th class="px-6 py-4 text-right">Venda VIP</th>
                                <th class="px-6 py-4 text-right">Venda iFood</th>
                                <th class="px-6 py-4 text-right">Venda Total</th>
                                <th class="px-6 py-4 text-center">Rupturas</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="text-sm font-bold text-slate-600">
                            <!-- Inserido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYAbzRN6yVIhTqgC17o5QlfH6uU5R8-0Jssq03US8b0R56ab_9ZGPsJr3sJvrlRSWm5AA7YdMINYMt/pub?output=csv';

        let dadosGlobais = [];
        let chartInstance = null;

        // Limpeza de número (suporta 1.250,50 ou 1250.50)
        function parseNum(v) {
            if (!v) return 0;
            let n = v.toString().replace('R$', '').replace(/\s/g, '');
            if (n.includes('.') && n.includes(',')) n = n.replace(/\./g, '').replace(',', '.');
            else n = n.replace(',', '.');
            return parseFloat(n) || 0;
        }

        async function init() {
            try {
                const res = await fetch(URL_CSV);
                const csv = await res.text();
                const linhas = csv.split('\n').map(l => l.split(','));
                dadosGlobais = linhas.slice(1);

                // Popular Filtro de Mês
                const mesesUnicos = [...new Set(dadosGlobais.map(c => c[0].trim()))].filter(m => m !== "");
                const select = document.getElementById('filtro-mes');
                mesesUnicos.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.innerText = m;
                    select.appendChild(opt);
                });

                // Evento de Filtro
                select.addEventListener('change', () => atualizarDashboard(select.value));

                atualizarDashboard("TODOS");
            } catch (e) { console.error("Erro:", e); }
        }

        function atualizarDashboard(mesFiltro) {
            let lojas = {};
            let mesesAgrupados = {};
            let totalGeral = 0;
            let metaTotal = 0;
            let rupturasTotal = 0;

            dadosGlobais.forEach(col => {
                const mes = col[0].trim();
                if (mesFiltro !== "TODOS" && mes !== mesFiltro) return;

                const nome = col[1].trim();
                const vVip = parseNum(col[2]);
                const vIfood = parseNum(col[3]);
                const meta = parseNum(col[4]);
                const rup = parseInt(col[7]) || 0;
                const vTotal = vVip + vIfood;

                totalGeral += vTotal;
                rupturasTotal += rup;
                if (meta > metaTotal) metaTotal = meta;

                mesesAgrupados[mes] = (mesesAgrupados[mes] || 0) + vTotal;

                if (!lojas[nome]) lojas[nome] = { vVip: 0, vIfood: 0, total: 0, rup: 0 };
                lojas[nome].vVip += vVip;
                lojas[nome].vIfood += vIfood;
                lojas[nome].total += vTotal;
                lojas[nome].rup += rup;
            });

            renderizar(lojas, mesesAgrupados, totalGeral, metaTotal, rupturasTotal);
        }

        function renderizar(lojas, meses, total, meta, rupturas) {
            // KPIs
            const melhorMes = Object.keys(meses).reduce((a, b) => meses[a] > meses[b] ? a : b, "---");
            document.getElementById('kpi-mes').innerText = melhorMes;
            document.getElementById('kpi-mes-valor').innerText = (meses[melhorMes] || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            document.getElementById('rupturas-total').innerText = rupturas;

            const perc = meta > 0 ? Math.min((total / meta) * 100, 100).toFixed(1) : 0;
            document.getElementById('kpi-meta-percent').innerText = perc + '%';
            document.getElementById('meta-bar').style.width = perc + '%';

            // Top Lojas
            let tVip = {n: '---', v: 0}, tIfood = {n: '---', v: 0};
            const lista = Object.keys(lojas).map(n => {
                const l = lojas[n];
                if(l.vVip > tVip.v) tVip = {n, v: l.vVip};
                if(l.vIfood > tIfood.v) tIfood = {n, v: l.vIfood};
                return {n, ...l};
            }).sort((a,b) => b.total - a.total);

            document.getElementById('top-vip').innerText = tVip.n;
            document.getElementById('top-ifood').innerText = tIfood.n;

            // Tabela
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = "";
            lista.forEach(l => {
                corpo.innerHTML += `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 text-slate-800">${l.n}</td>
                        <td class="px-6 py-4 text-right text-blue-700">${l.vVip.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
                        <td class="px-6 py-4 text-right text-rose-500">${l.vIfood.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
                        <td class="px-6 py-4 text-right font-black text-slate-900">${l.total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
                        <td class="px-6 py-4 text-center">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-[10px]">${l.rup}</span>
                        </td>
                    </tr>
                `;
            });

            // Gráfico
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('chartBarras').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: lista.slice(0, 10).map(l => l.n),
                    datasets: [{
                        data: lista.slice(0, 10).map(l => l.total),
                        backgroundColor: '#1e3a8a',
                        borderRadius: 10,
                        barThickness: 25
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false },
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' } } }
                    }
                }
            });
        }

        function exportarExcel() {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.table_to_sheet(document.getElementById('tabela-dados'));
            XLSX.utils.book_append_sheet(wb, ws, "Relatorio_Ecommerce");
            XLSX.utils.writeFile(wb, "Dashboard_Vendas.xlsx");
        }

        init();
    </script>
</body>
</html>
