<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PINHEIRO | PERFORMANCE & METAS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0a0a0c; --card-bg: #1c1c1e;
            --pinheiro-blue: #2b2d84; --pinheiro-orange: #f38218; --pinheiro-green: #22c55e;
            --pinheiro-red: #ef4444;
            --text-main: #ffffff; --text-dim: #a1a1aa; --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 30px; }
        .container { max-width: 1450px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .title-group h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; }
        .status-pills { display: flex; gap: 15px; margin-top: 15px; }
        .pill { background: var(--card-bg); padding: 10px 20px; border-radius: 50px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pinheiro-orange); }
        .dot.online { background: var(--pinheiro-green); box-shadow: 0 0 10px var(--pinheiro-green); }

        .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card-meta { background: var(--card-bg); padding: 25px; border-radius: 28px; border: 1px solid var(--border); text-align: center; }
        .meta-label { font-size: 12px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; }
        .meta-value { font-size: 28px; font-weight: 800; margin: 10px 0; display: block; }
        .meta-percent { font-size: 14px; font-weight: 700; padding: 5px 15px; border-radius: 50px; display: inline-block; }
        
        .bg-red { background: rgba(239, 68, 68, 0.15); color: var(--pinheiro-red); border: 1px solid var(--pinheiro-red); }
        .bg-orange { background: rgba(243, 130, 24, 0.15); color: var(--pinheiro-orange); border: 1px solid var(--pinheiro-orange); }
        .bg-green { background: rgba(34, 197, 94, 0.15); color: var(--pinheiro-green); border: 1px solid var(--pinheiro-green); }

        .table-section { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 15px; background: #111827; color: var(--text-dim); border: 1px solid var(--border); }
        td { padding: 12px 15px; border: 1px solid var(--border); }
        tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .val-bold { font-family: 'Courier New', monospace; font-weight: bold; text-align: right; }

        select { background: #000; color: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-group">
                <p style="color: var(--pinheiro-orange); font-weight: bold; font-size: 12px; letter-spacing: 2px;">BOM VIZINHO DATA HUB</p>
                <h1>Análise de Metas E-commerce</h1>
                <div class="status-pills">
                    <div class="pill"><div id="status-dot" class="dot"></div> <span id="status-text">Sincronizando...</span></div>
                    <select id="mesSelect" onchange="atualizarDashboard()"><option value="consolidado">Consolidado Anual</option></select>
                </div>
            </div>
            <img src="https://raw.githubusercontent.com/CamilaDS13/imagens/Principal/logobranca.png" style="height: 45px;">
        </header>

        <div class="meta-grid">
            <div class="card-meta">
                <span class="meta-label">Atingimento Geral</span>
                <span id="meta-geral-val" class="meta-value">R$ 0,00</span>
                <div id="meta-geral-pct" class="meta-percent">0% atingido</div>
            </div>
            <div class="card-meta">
                <span class="meta-label">Atingimento VIP (App)</span>
                <span id="meta-app-val" class="meta-value">R$ 0,00</span>
                <div id="meta-app-pct" class="meta-percent">0% atingido</div>
            </div>
            <div class="card-meta">
                <span class="meta-label">Atingimento IFood</span>
                <span id="meta-ifood-val" class="meta-value">R$ 0,00</span>
                <div id="meta-ifood-pct" class="meta-percent">0% atingido</div>
            </div>
        </div>

        <div class="table-section">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th style="width:220px">Loja</th>
                        <th class="val-bold">Venda VIP</th><th class="val-bold">Venda IFOOD</th>
                        <th class="val-bold">Venda Total</th><th class="val-bold" style="color:var(--pinheiro-orange)">% Part. Empresa</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // NOVO ID DA PLANILHA DE METAS
        const SHEET_ID = '1PfUPSIDHoTx_ul0LPS7hXU8uayYQ73PclFnz60T9K3w';
        const URL_DADOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`;

        let rawData = [];
        const ordemMeses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

        async function carregarDados() {
            try {
                const response = await fetch(URL_DADOS + "&t=" + new Date().getTime());
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

                if (rows.length > 1) {
                    processarDados(rows);
                    document.getElementById('status-dot').className = "dot online";
                    document.getElementById('status-text').innerText = "Dados Atualizados";
                }
            } catch (e) { document.getElementById('status-text').innerText = "Erro ao buscar dados"; }
        }

        function limpar(v) {
            if (v === undefined || v === null || v === "") return 0;
            if (typeof v === 'number') return v;
            let n = v.toString().replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
            return parseFloat(n) || 0;
        }

        function processarDados(rows) {
            // Mapeamento baseado no seu print das colunas: 0:Data, 1:Loja, 2:Vip, 3:Ifood, 4:MetaG, 5:MetaA, 6:MetaI
            rawData = rows.slice(1).map(r => {
                if(!r[1]) return null;
                return {
                    mes: (r[0] || "").toString().toUpperCase().trim(),
                    loja: r[1],
                    vVip: limpar(r[2]),
                    vIfood: limpar(r[3]),
                    mGeral: limpar(r[4]),
                    mApp: limpar(r[5]),
                    mIfood: limpar(r[6])
                };
            }).filter(i => i !== null);

            const meses = [...new Set(rawData.map(i => i.mes))].sort((a,b) => ordemMeses.indexOf(a) - ordemMeses.indexOf(b));
            const select = document.getElementById('mesSelect');
            meses.forEach(m => {
                if(m && m !== "DATA") select.innerHTML += `<option value="${m}">${m}</option>`;
            });
            
            atualizarDashboard();
        }

        function definirCorMeta(percentual) {
            if (percentual >= 100) return 'bg-green';
            if (percentual >= 80) return 'bg-orange';
            return 'bg-red';
        }

        function atualizarDashboard() {
            const filtro = document.getElementById('mesSelect').value;
            let dados = filtro === 'consolidado' ? rawData : rawData.filter(i => i.mes === filtro);
            
            const totalVIP = dados.reduce((a,b) => a + b.vVip, 0);
            const totalIFood = dados.reduce((a,b) => a + b.vIfood, 0);
            const realizadoTotal = totalVIP + totalIFood;

            let metaGeral, metaApp, metaIfood;
            if (filtro === 'consolidado') {
                let metasMes = {};
                rawData.forEach(i => { if(!metasMes[i.mes]) metasMes[i.mes] = {g:i.mGeral, a:i.mApp, f:i.mIfood}; });
                metaGeral = Object.values(metasMes).reduce((a,b) => a + b.g, 0);
                metaApp = Object.values(metasMes).reduce((a,b) => a + b.a, 0);
                metaIfood = Object.values(metasMes).reduce((a,b) => a + b.f, 0);
            } else {
                metaGeral = dados[0].mGeral;
                metaApp = dados[0].mApp;
                metaIfood = dados[0].mIfood;
            }

            atualizarCardMeta('meta-geral', realizadoTotal, (realizadoTotal/metaGeral*100)||0);
            atualizarCardMeta('meta-app', totalVIP, (totalVIP/metaApp*100)||0);
            atualizarCardMeta('meta-ifood', totalIFood, (totalIFood/metaIfood*100)||0);

            const lojasT = {};
            dados.forEach(i => {
                if(!lojasT[i.loja]) lojasT[i.loja] = { vV:0, vI:0, vT:0 };
                lojasT[i.loja].vV += i.vVip;
                lojasT[i.loja].vI += i.vIfood;
                lojasT[i.loja].vT += (i.vVip + i.vIfood);
            });

            document.getElementById('table-body').innerHTML = Object.keys(lojasT).sort((a,b) => lojasT[b].vT - lojasT[a].vT).map(l => `
                <tr>
                    <td><strong>${l}</strong></td>
                    <td class="val-bold">R$ ${lojasT[l].vV.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                    <td class="val-bold">R$ ${lojasT[l].vI.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                    <td class="val-bold">R$ ${lojasT[l].vT.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                    <td class="val-bold" style="color:var(--pinheiro-orange)">${((lojasT[l].vT/realizadoTotal)*100 || 0).toFixed(2)}%</td>
                </tr>
            `).join('');
        }

        function atualizarCardMeta(id, valor, percent) {
            document.getElementById(`${id}-val`).innerText = valor.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            const elPct = document.getElementById(`${id}-pct`);
            elPct.innerText = percent.toFixed(1) + "% atingido";
            elPct.className = "meta-percent " + definirCorMeta(percent);
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
